<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#102039"><link rel="icon" type="image/svg+xml" href="./favicon.svg?v=2"><title>10Shapes</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,Arial;background:#0b1629;color:white;overscroll-behavior:none}#app{height:100dvh;max-width:560px;margin:auto;display:flex;flex-direction:column;background:#23354f}header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 12px 12px;background:#101e34}header strong{font-size:15px}header small{display:block;color:#adc0da;font-size:11px}#clock{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}button{background:#1c3556;border:1px solid #7595c4;color:#fff;border-radius:14px;padding:10px 12px;font-weight:700}#board{flex:1;position:relative;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 46%,#66748b,#3c526e 70%,#243751)}#board:before{content:"";position:absolute;inset:0;opacity:.09;pointer-events:none;background:repeating-linear-gradient(35deg,transparent 0 21px,#fff 22px 23px)}.slot,.piece{position:absolute;width:17%;aspect-ratio:1;transform:translate(-50%,-50%);touch-action:none}.slot{visibility:hidden}.board-live .slot{visibility:visible}.slot svg,.piece svg{width:100%;height:100%;overflow:visible}.slot path{fill:#111925;stroke:#dfb679;stroke-width:1.8;filter:drop-shadow(0 1px 2px #e1ad65)}.slot.done path{fill:#166b4b;stroke:#7fe5a3}.pedestal{position:absolute;left:50%;top:50%;width:28%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 30% 20%,#838793,#2c3444);border:3px solid #b49a71;box-shadow:0 12px 17px #0c152c8a;pointer-events:none}.piece{left:50%;top:50%;z-index:3;filter:drop-shadow(0 7px 4px #092219aa)}.piece path{fill:#27c967;stroke:#a2ffc3;stroke-width:2}.piece.drag{z-index:10}.piece.done{pointer-events:none}footer{flex:none;display:flex;justify-content:space-between;align-items:center;gap:6px;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:#0c1c30;font-size:12px}footer button{font-size:12px;padding:10px 9px}footer button{flex:1}.handLabel{flex:1;align-self:center;text-align:center;font-size:12px;font-weight:700;color:#c4d4ea}footer button.selected{background:#236b55;border-color:#9be5b8}#msg{display:none}#countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;pointer-events:none}#startButton{pointer-events:auto;font-size:24px;padding:18px 36px;background:#206a4e;border:2px solid #a3edbb;box-shadow:0 6px 20px #081d2a99}#countNumber{font-size:clamp(90px,25vw,160px);color:#fff;text-shadow:0 5px 25px #091b2e;display:none}#ranking{position:absolute;inset:0;background:#101e34f5;z-index:40;overflow-y:auto;display:flex;flex-direction:column;align-items:stretch;padding:20px;gap:10px}#ranking h2{text-align:center;margin:5px}#rankRows{flex:1;overflow:auto;font-size:14px}#rankRows .rankline{display:flex;justify-content:space-between;border-bottom:1px solid #52617a;padding:9px 2px}#rankSubmit{display:flex;flex-wrap:wrap;gap:8px}#rankSubmit p{width:100%;margin:3px}#rankSubmit input{min-width:0;flex:1;width:25%;border-radius:9px;background:#23354f;border:1px solid #7595c4;padding:10px;color:white}#finish{display:none;position:absolute;inset:0;background:#0b172cdd;z-index:30;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:25px}#finish h2{font-size:27px}#board.complete #finish{display:flex}

/* Keep the timer and all controls inside even the narrowest phone viewport. */
html,body{width:100%;overflow-x:hidden}#app{width:100%;min-width:0}
header{display:grid;grid-template-columns:minmax(0,1fr) repeat(4,40px);gap:8px;padding:calc(10px + env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 10px max(10px,env(safe-area-inset-left))}
header>div{min-width:0}header>div:nth-child(2){grid-column:1 / 3;grid-row:1}header strong{display:block}header>div:nth-child(2)>strong{white-space:nowrap}
#clock{grid-column:3 / 6;grid-row:1;text-align:right;font-size:clamp(22px,6vw,28px);white-space:nowrap}
header>div:nth-child(4){grid-column:1;grid-row:2}#best{font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
header button{width:40px;height:40px;min-width:0;padding:0;font-size:18px;display:grid;place-items:center}
#restart{grid-column:2;grid-row:2}#soundToggle{grid-column:3;grid-row:2}#rankingButton{grid-column:4;grid-row:2}#refresh{grid-column:5;grid-row:2}
</style></head><body><div id="app"><header><button id="restart" title="Nuova partita">↺</button><div><strong>LIVELLO 1 <span style="font-size:10px;color:#9bb5d5">v0.5.4</span></strong><small id="progress">0 / 10 forme</small></div><div id="clock">00:00.000</div><div><small>RECORD</small><strong id="best">—</strong></div><button id="soundToggle" title="Disattiva musica" aria-label="Disattiva musica">♫</button><button id="rankingButton" title="Classifica mondiale">🏆</button><button id="refresh" title="Aggiorna sito" aria-label="Aggiorna sito">⟳</button></header><main id="board"><div class="pedestal"></div><div id="countdown" aria-live="polite"><button id="startButton">START</button><strong id="countNumber"></strong></div><div id="ranking" style="display:none"><button id="closeRanking" style="align-self:flex-end">✕</button><h2>🏆 Classifica mondiale</h2><p style="font-size:12px;color:#b8c8df">Livello 1 · Tempi sperimentali</p><div id="rankRows">Caricamento...</div><div id="rankSubmit"><p>Il tuo profilo · il record viene inviato automaticamente</p><input id="nick" maxlength="20" placeholder="Nickname (2–20 caratteri)"><input id="country" maxlength="2" placeholder="IT" value="IT"><button id="sendScore">Salva nome</button><p id="rankMessage"></p></div></div><div id="finish"><h2>Livello completato</h2><p id="summary"></p><button id="again">Rigioca</button></div></main><footer><span id="msg" aria-live="polite"></span><button id="leftHand">Sinistra</button><span class="handLabel">Mano dominante</span><button id="rightHand">Destra</button></footer></div>
<script>
(function(){
const board=document.getElementById('board'),clock=document.getElementById('clock'),progress=document.getElementById('progress'),msg=document.getElementById('msg'),best=document.getElementById('best'),NS='http://www.w3.org/2000/svg';
// Exactly one randomly chosen variant from each of the ten groups per game.
const quarterTurns=[0,90,180,270];
const shapeGroups=[
{family:'circle',variants:[{path:'M 50 10 A 40 40 0 1 1 49.99 10 Z'}]},
{family:'square',variants:[{path:'M 12 12 H 88 V 88 H 12 Z'}]},
{family:'ell',variants:[{path:'M 12 12 H 42 V 58 H 88 V 88 H 12 Z',rotations:quarterTurns}]},
{family:'ring',variants:[{path:'M 50 10 A 40 40 0 1 1 49.99 10 Z M 50 28 A 22 22 0 1 1 49.99 28 Z'}]},
{family:'square-hole',variants:[{path:'M 12 12 H 88 V 88 H 12 Z M 30 30 H 70 V 70 H 30 Z'}]},
{family:'star',variants:[
{path:'M 50 6 L 62 38 L 94 50 L 62 62 L 50 94 L 38 62 L 6 50 L 38 38 Z'},
{path:'M 50 7 L 63 34 L 93 38 L 70 59 L 77 91 L 50 73 L 23 91 L 30 59 L 7 38 L 37 34 Z'}]},
{family:'rectangle',variants:[{path:'M 12 28 H 88 V 72 H 12 Z',rotations:[0,90]}]},
{family:'semicircle',variants:[{path:'M 10 50 A 40 40 0 0 1 90 50 Z',rotations:quarterTurns}]},
{family:'triangle',variants:[{path:'M 50 8 L 92 80.746 H 8 Z',rotations:quarterTurns}]},
{family:'crescent',variants:[{path:'M 68 12 A 42 42 0 1 0 68 88 A 40 40 0 0 1 68 12 Z',rotations:quarterTurns}]}
];
const shapeCatalog=shapeGroups.flatMap(group=>group.variants.flatMap(variant=>(variant.rotations||[0]).map(rotation=>({family:group.family,path:variant.path,rotation}))));
const paths=shapeCatalog;
function selectShapes(){return shuffled(shapeGroups.map(group=>{const choices=shapeCatalog.map((shape,id)=>shape.family===group.family?id:-1).filter(id=>id>=0);return choices[Math.floor(Math.random()*choices.length)]}))}

let handed=localStorage.getItem("silhouette_hand")==="left"?"left":"right";function positions(){const cells=[[0,0],[1,0],[2,0],[0,1],[2,1],[2,2],[2,3],[0,4],[1,4],[2,4]];return cells.map(([col,row])=>{const actualCol=handed==="left"?col:2-col;return [(actualCol+0.5)*100/3,(row+0.5)*100/5]})} function handLabel(){document.getElementById("leftHand").classList.toggle("selected",handed==="left");document.getElementById("rightHand").classList.toggle("selected",handed==="right")}
let ids=[],slots=[],count=0,active=null,start=null,elapsed=0,frame=0,offset=null,phase="ready",countdownTimers=[];
const MAX_TIME=60000;let audioCtx=null,musicTimer=null,musicOn=localStorage.getItem("10shapes_music")!=="off",nextBeat=0,beatCount=0,reverbInput=null;
function audioReady(){if(!musicOn)return;try{if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();
// A diffuse room tail rather than a single repeating echo.
const room=audioCtx.createConvolver(),seconds=1.6,length=Math.ceil(audioCtx.sampleRate*seconds),impulse=audioCtx.createBuffer(2,length,audioCtx.sampleRate);
for(let channel=0;channel<2;channel++){const samples=impulse.getChannelData(channel);for(let i=0;i<length;i++)samples[i]=(Math.random()*2-1)*Math.pow(1-i/length,2.4)}
room.buffer=impulse;const wet=audioCtx.createGain(),preDelay=audioCtx.createDelay(.1);preDelay.delayTime.value=.025;wet.gain.value=.38;preDelay.connect(room);room.connect(wet);wet.connect(audioCtx.destination);reverbInput=preDelay}if(audioCtx.state==="suspended")audioCtx.resume()}catch(e){audioCtx=null}}
function tone(freq,when,duration,volume,type="sine"){if(!audioCtx||!musicOn)return;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,when);gain.gain.setValueAtTime(.0001,when);gain.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),when+.012);gain.gain.exponentialRampToValueAtTime(.0001,when+duration);osc.connect(gain);gain.connect(audioCtx.destination);if(reverbInput)gain.connect(reverbInput);osc.start(when);osc.stop(when+duration+.02)}
function countdownTick(high=false){if(!audioCtx||!musicOn)return;const when=audioCtx.currentTime+.005;tone(high?880:660,when,.075,.055,"sine");if(high)tone(1320,when,.10,.025,"triangle")}
function musicTick(){if(phase!=="playing"||!audioCtx||!musicOn)return;const p=Math.min(1,(performance.now()-start)/MAX_TIME),interval=.7-.51*Math.pow(p,1.4),now=audioCtx.currentTime;while(nextBeat<now+.11){const notes=[220,261.63,293.66,329.63,293.66,261.63,246.94,196],n=notes[beatCount%notes.length],accent=beatCount%4===0;tone(n,nextBeat,Math.min(interval*.7,.26),.027+p*.023,"triangle");if(accent)tone(n/2,nextBeat,Math.min(.20,interval*.6),.033+p*.025,"sine");if(p>.55&&beatCount%2===1)tone(660,nextBeat,.045,.009+p*.013,"square");beatCount++;nextBeat+=interval}}
function stopMusic(){if(musicTimer!==null){clearInterval(musicTimer);musicTimer=null}}
function startMusic(){stopMusic();if(!musicOn)return;audioReady();if(!audioCtx)return;beatCount=0;nextBeat=audioCtx.currentTime+.05;musicTimer=setInterval(musicTick,55);musicTick()}
function soundLabel(){const b=document.getElementById("soundToggle");b.textContent=musicOn?"♫":"✕";b.title=musicOn?"Disattiva musica":"Attiva musica";b.setAttribute("aria-label",b.title)}
const rankingApi="https://bboijzuzhgvfxqrsfatw.supabase.co/functions/v1/ten-shapes-ranking";let playerId=localStorage.getItem("10shapes_player_id");if(!playerId){playerId=crypto.randomUUID();localStorage.setItem("10shapes_player_id",playerId)}let playerNick=localStorage.getItem("10shapes_nick");if(!playerNick){playerNick="Player-"+String(Math.floor(Math.random()*90000)+10000);localStorage.setItem("10shapes_nick",playerNick)}let playerCountry=localStorage.getItem("10shapes_country")||"IT";document.getElementById("nick").value=playerNick;document.getElementById("country").value=playerCountry;
async function showRanking(){const el=document.getElementById("ranking");el.style.display="flex";const rows=document.getElementById("rankRows");rows.textContent="Caricamento...";try{const r=await fetch(rankingApi+"?level=1");if(!r.ok)throw Error();const data=await r.json();rows.replaceChildren();if(!data.scores.length){rows.textContent="Ancora nessun record pubblicato."}data.scores.forEach((s,i)=>{const line=document.createElement("div");line.className="rankline";const who=document.createElement("span"),score=document.createElement("strong");who.textContent=(i+1)+". "+s.country+" · "+s.nickname;score.textContent=time(s.time_ms);line.append(who,score);rows.appendChild(line)})}catch(e){rows.textContent="Classifica temporaneamente non disponibile."}}
async function sendScore(){const note=document.getElementById("rankMessage"),nick=document.getElementById("nick").value.trim(),country=document.getElementById("country").value.trim().toUpperCase();note.textContent="Salvataggio...";try{const r=await fetch(rankingApi,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"rename",player_id:playerId,nickname:nick,country})});const d=await r.json();if(!r.ok)throw Error(d.error||"Errore");playerNick=nick;playerCountry=country;localStorage.setItem("10shapes_nick",nick);localStorage.setItem("10shapes_country",country);await showRanking();note.textContent="Nome aggiornato nella classifica."}catch(e){note.textContent=e.message||"Errore"}}
async function autoScore(ms){try{const r=await fetch(rankingApi,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"score",player_id:playerId,nickname:playerNick,country:playerCountry,level:1,time_ms:Math.round(ms)})});if(!r.ok)throw Error("invio");}catch(e){console.warn("10Shapes: record non inviato",e)}}
function shuffled(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function shape(path){let svg=document.createElementNS(NS,'svg'),p=document.createElementNS(NS,'path');svg.setAttribute('viewBox','0 0 100 100');p.setAttribute('d',path.path);p.setAttribute('fill-rule','evenodd');p.setAttribute('transform','rotate('+path.rotation+' 50 50)');svg.appendChild(p);return svg}
function time(t){let m=Math.floor(t/60000),s=Math.floor(t/1000)%60,ms=Math.floor(t%1000);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(ms).padStart(3,'0')}
function update(){if(start!==null){elapsed=Math.min(MAX_TIME,performance.now()-start);clock.textContent=time(elapsed);if(elapsed>=MAX_TIME){finishLevel(false);return}frame=requestAnimationFrame(update)}}
function finishLevel(won){cancelAnimationFrame(frame);stopMusic();start=null;phase="finished";const record=Number(localStorage.getItem("silhouette_record_10_handed")||0);if(won){autoScore(elapsed);let bestTime=record;if(!record||elapsed<record){bestTime=elapsed;localStorage.setItem("silhouette_record_10_handed",bestTime)}best.textContent=time(bestTime);document.getElementById("summary").textContent="Tempo "+time(elapsed)+" · Record "+time(bestTime);document.querySelector("#finish h2").textContent="Livello completato"}else{document.querySelector("#finish h2").textContent="Tempo scaduto";document.getElementById("summary").textContent="60 secondi · "+count+" / 10 forme"}board.classList.add("complete")}
function clearCountdown(){countdownTimers.forEach(clearTimeout);countdownTimers=[]}function begin(){if(phase!=="ready")return;audioReady();phase="countdown";const btn=document.getElementById("startButton"),number=document.getElementById("countNumber");btn.style.display="none";number.style.display="block";number.textContent="3";countdownTick();[2,1].forEach((n,i)=>countdownTimers.push(setTimeout(()=>{if(phase==="countdown")number.textContent=String(n);countdownTick()},(i+1)*1000)));countdownTimers.push(setTimeout(()=>{if(phase!=="countdown")return;document.getElementById("countdown").style.display="none";phase="playing";board.classList.add("board-live");start=performance.now();countdownTick(true);startMusic();next();update()},3000))}function next(){if(count===10){finishLevel(true);return}
let piece=document.createElement('div');piece.className='piece';piece.appendChild(shape(paths[ids[count]]));board.appendChild(piece);active=piece;piece.addEventListener('pointerdown',down)}
function setup(){stopMusic();clearCountdown();phase="ready";document.getElementById("countdown").style.display="flex";document.getElementById("startButton").style.display="block";document.getElementById("countNumber").style.display="none";cancelAnimationFrame(frame);start=null;elapsed=0;count=0;offset=null;board.classList.remove('complete','board-live');board.querySelectorAll('.slot,.piece').forEach(e=>e.remove());clock.textContent='00:00.000';progress.textContent='0 / 10 forme';msg.textContent='Trascina la forma nella sagoma corrispondente.';let record=Number(localStorage.getItem('silhouette_record_10_handed')||0);best.textContent=record?time(record):'—';ids=selectShapes();let ps=shuffled(positions());slots=ids.map((id,i)=>{let s=document.createElement('div');s.className='slot';s.style.left=ps[i][0]+'%';s.style.top=ps[i][1]+'%';s.appendChild(shape(paths[id]));board.appendChild(s);return s});msg.textContent="Premi START per iniziare."}
function down(e){if(phase!=="playing")return;e.preventDefault();active.setPointerCapture(e.pointerId);active.classList.add('drag');let r=active.getBoundingClientRect();offset={x:e.clientX-(r.left+r.width/2),y:e.clientY-(r.top+r.height/2)};active.addEventListener('pointermove',move);active.addEventListener('pointerup',up);active.addEventListener('pointercancel',up)}
function move(e){if(!offset)return;let b=board.getBoundingClientRect();active.style.left=Math.max(0,Math.min(b.width,e.clientX-b.left-offset.x))+'px';active.style.top=Math.max(0,Math.min(b.height,e.clientY-b.top-offset.y))+'px'}
function up(e){if(!offset)return;offset=null;let p=active;p.classList.remove('drag');p.removeEventListener('pointermove',move);p.removeEventListener('pointerup',up);p.removeEventListener('pointercancel',up);let target=slots[count],a=p.getBoundingClientRect(),b=target.getBoundingClientRect();let d=Math.hypot(a.left+a.width/2-b.left-b.width/2,a.top+a.height/2-b.top-b.height/2);if(d<a.width*.46){p.style.left=target.style.left;p.style.top=target.style.top;p.classList.add('done');target.classList.add('done');count++;progress.textContent=count+' / 10 forme';active=null;next()}else{p.style.left='50%';p.style.top='50%';msg.textContent='Riprova: cerca la sagoma esatta.'}}
document.getElementById("soundToggle").onclick=()=>{musicOn=!musicOn;localStorage.setItem("10shapes_music",musicOn?"on":"off");soundLabel();if(!musicOn)stopMusic();else if(phase==="playing")startMusic()};soundLabel();document.getElementById('rankingButton').onclick=showRanking;document.getElementById('closeRanking').onclick=()=>document.getElementById('ranking').style.display='none';document.getElementById('sendScore').onclick=sendScore;document.getElementById('startButton').onclick=begin;function chooseHand(value){if(handed===value)return;handed=value;localStorage.setItem("silhouette_hand",handed);handLabel();setup()}

document.getElementById("leftHand").onclick=()=>chooseHand("left");document.getElementById("rightHand").onclick=()=>chooseHand("right");
document.getElementById("refresh").onclick=()=>{const url=new URL(location.href);url.searchParams.set("refresh",Date.now().toString());location.replace(url.toString())};handLabel();document.getElementById('restart').onclick=setup;document.getElementById('again').onclick=setup;setup();
})();
</script></body></html>
