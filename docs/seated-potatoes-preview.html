<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10Potatoes · sguardi ed espressioni</title><style>body{margin:0;background:#382015;font:15px system-ui;color:#ffedc6}main{max-width:500px;margin:auto;padding:16px}h1{font-size:20px;margin:0 0 8px}p{font-size:13px;line-height:1.5}label{display:flex;gap:10px;align-items:center;margin:14px 0}input{flex:1;accent-color:#efb954}button{border:1px solid #aa7742;border-radius:12px;background:#edc077;color:#452719;padding:10px;font-weight:700}#board{position:relative;aspect-ratio: .70;background-color:#c5ab83;background-image:linear-gradient(#fff2 1px,transparent 1px),linear-gradient(90deg,#fff2 1px,transparent 1px);background-size:40px 40px;border-radius:18px;overflow:hidden;touch-action:none}.piece{position:absolute;width:27%;aspect-ratio:1;transform:translate(-50%,-50%);filter:drop-shadow(1px 4px 2px #0008);pointer-events:none}.piece svg{width:100%;height:100%;overflow:visible}.piece:not(.done){display:none}.piece.active{display:block;pointer-events:auto;cursor:grab;z-index:5}.piece .potatoMouth,.piece .potatoEyes,.piece .potatoBrows{transform-box:fill-box;transform-origin:center}</style><style>/* Animate facial parts only. Piece position, silhouette and peel are never transformed. */
#app #board .piece.done[data-peer-seed] .potatoEyes{transform-box:fill-box;transform-origin:center;animation:peerBlink var(--peer-blink,6s) var(--peer-delay,0s) infinite}
#app #board .piece.done[data-peer-busy] .potatoPupils{translate:var(--peer-x,0px) var(--peer-y,0px)!important;transition:translate .24s ease}
#app #board .piece.done[data-peer-busy] .potatoBrows,#app #board .piece.done[data-peer-busy] .potatoMouth{transform-box:fill-box;transform-origin:center;transition:scale .2s,rotate .2s,translate .2s}
#app #board .piece.done[data-peer-mood=cheeky] .potatoBrows{rotate:-9deg;translate:0 -4px}
#app #board .piece.done[data-peer-mood=cheeky] .potatoMouth{rotate:8deg;scale:1.12 .75}
#app #board .piece.done[data-peer-mood=curious] .potatoBrows{rotate:8deg;translate:0 -6px}
#app #board .piece.done[data-peer-mood=curious] .potatoMouth{scale:.8 .9}
#app #board .piece.done[data-peer-mood=surprise] .potatoEyes{animation:none;scale:1 1.12}
#app #board .piece.done[data-peer-mood=surprise] .potatoBrows{translate:0 -10px}
#app #board .piece.done[data-peer-mood=surprise] .potatoMouth{scale:.65 1.35}
#app #board .piece.done[data-peer-mood=laugh] .potatoEyes{animation:none;scale:1 .7}
#app #board .piece.done[data-peer-mood=laugh] .potatoMouth{animation:peerLaugh .24s ease-in-out 4 alternate}
@keyframes peerLaugh{from{scale:1.05 1.05}to{scale:1.2 1.4}}
@keyframes peerBlink{0%,91%,96%,100%{scale:1 1}93%{scale:1 .08}}
@media(prefers-reduced-motion:reduce){#app #board .piece.done[data-peer-seed] .potatoEyes,#app #board .piece.done[data-peer-busy] .potatoMouth{animation:none!important;transition:none!important}}

#app #board.game-screen:not(.complete) .piece.done[data-peer-seed] .potatoPupils{translate:var(--peer-x,0px) var(--peer-y,0px)!important;transition:translate .14s ease-out}
#app #board.game-screen:not(.complete) .piece.done[data-peer-seed] .potatoMouth{transform-box:fill-box;transform-origin:center;scale:var(--peer-smile-x,.7) var(--peer-smile-y,.3)!important;transition:scale .65s ease}
#app #board.game-screen:not(.complete) .piece.done[data-peer-seed] .potatoBrows{translate:0 var(--peer-brow-y,0px);transition:translate .65s ease}

/* Animate the inner SVG, preserving the seated piece's exact board coordinates. */
#app #board .piece.done[data-seat-pop] > svg:not(.ground-shadow){transform-origin:50% 65%;animation:potatoSeatPop .44s cubic-bezier(.22,.7,.35,1) both}
@keyframes potatoSeatPop{0%{scale:1 1}22%{scale:1.1 .86}48%{scale:.94 1.08}72%{scale:1.035 .97}100%{scale:1 1}}
@media(prefers-reduced-motion:reduce){#app #board .piece.done[data-seat-pop] > svg:not(.ground-shadow){animation:none}}
#app #board.game-screen .piece.done[data-peer-seed] .potatoPupils{transform:none!important}
#app #board.game-screen .piece.done[data-peer-busy] .potatoPupils{animation:none!important}

/* Ground contact is a separate, stationary silhouette, outside the animated body. */
#app #board.game-screen .piece[data-ground-shadow]{filter:none!important}
#app #board.game-screen .piece[data-ground-shadow] > svg:not(.ground-shadow){position:relative;z-index:1}
#app #board.game-screen .piece > svg.ground-shadow{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.72;transform:translate(1px,3px);filter:blur(1.4px);animation:none!important;}

#app #board.game-screen .piece.done[data-seat-pop] > svg.ground-shadow{transform-origin:50% 65%;animation:potatoSeatPop .44s cubic-bezier(.22,.7,.35,1) both!important}
@media(prefers-reduced-motion:reduce){#app #board.game-screen .piece.done[data-seat-pop] > svg.ground-shadow{animation:none!important}}

/* Discreet live easter eggs; the body and ground shadow stay untouched. */
#app #board.game-screen:not(.complete) .piece.done[data-egg=complicit] .potatoBrows{rotate:-7deg;translate:0 -6px}
#app #board.game-screen:not(.complete) .piece.done[data-egg=complicit] .potatoMouth{scale:.95 .6!important;rotate:5deg;transition:scale .18s,rotate .18s}
#app #board.game-screen:not(.complete) .piece.done[data-egg=sleep] .potatoEyes{animation:none!important;scale:1 .08;transition:scale .55s ease}
#app #board.game-screen:not(.complete) .piece.done[data-egg=sleep] .potatoBrows{translate:0 5px;rotate:0deg}
#app #board.game-screen:not(.complete) .piece.done[data-egg=sleep] .potatoMouth{scale:.55 .18!important}
#app #board.game-screen:not(.complete) .piece.done[data-egg=wake] .potatoEyes{animation:none!important;scale:1 1.13;transition:scale .15s ease-out}
#app #board.game-screen[data-last-piece] .piece.done .potatoEyes{animation:none!important;scale:1 1.07;transition:scale .3s}
#app #board.game-screen[data-last-piece] .piece.done .potatoBrows{translate:0 -8px}
@media(prefers-reduced-motion:reduce){#app #board .piece.done[data-egg] .potatoEyes,#app #board .piece.done[data-egg] .potatoMouth{transition:none!important}}

/* Mouth silhouettes now express neutral, surprise and sleep instead of scaling one smile. */
#app #board.game-screen:not(.complete) .piece.done[data-peer-seed] .potatoMouth{scale:1 1!important}
#app #board.game-screen:not(.complete) .piece.done[data-peer-seed][data-egg] .potatoMouth{scale:1 1!important}

/* Brief post-game teasing; animate only the new tongue and the lips. */
#app #board.complete .piece.done[data-peer-mood=tongue] .potatoBrows{rotate:-8deg}
#app #board.complete .piece.done[data-peer-mood=raspberry] .potatoMouth{transform-box:fill-box;transform-origin:center;animation:potatoPfft .14s ease-in-out 6 alternate}
#app #board.complete .piece.done[data-peer-mood=raspberry] .potatoTongue{transform-box:fill-box;transform-origin:50% 0;rotate:0deg;animation:potatoTongueFlutter .09s ease-in-out 9 alternate}
@keyframes potatoPfft{from{scale:1 1}to{scale:1.08 .94}}
@keyframes potatoTongueFlutter{from{rotate:-7deg}to{rotate:7deg}}
@media(prefers-reduced-motion:reduce){#app #board.complete .piece.done[data-peer-mood=raspberry] .potatoMouth,#app #board.complete .piece.done[data-peer-mood=raspberry] .potatoTongue{animation:none!important}}

/* The blush and green pallor affect peel only, preserving faces and ground shadows. */
#app #board.complete .piece[data-prank] .front-face{transition:filter .65s ease}
#app #board.complete .piece[data-prank=blush] .front-face{filter:sepia(.25) saturate(3) hue-rotate(-40deg)!important}
#app #board.complete .piece[data-prank=hold] .front-face{filter:sepia(.35) saturate(1.8) hue-rotate(55deg)!important}
#app #board.complete .piece[data-prank] .potatoEyes{animation:none!important}
#app #board.complete .piece[data-prank=hold] .potatoMouth{scale:1 1}
#app #board.complete .piece[data-prank=laugh] .potatoMouth{animation:peerLaugh .2s ease-in-out infinite alternate}
#app #board.complete .piece[data-prank] .potatoPupils{translate:var(--peer-x,0px) var(--peer-y,0px)!important;animation:none!important}
#app #board.complete .piece[data-prank=blush]::after{content:"";position:absolute;right:-4%;bottom:8%;width:40%;height:25%;pointer-events:none;border-radius:50%;background:radial-gradient(ellipse,#a0b96866,transparent 70%);opacity:0;animation:potatoPuff 1.3s .8s ease-out both}
#app #board.complete .piece[data-prank=whistle]::after{content:"♪";position:absolute;right:5%;top:14%;font-size:clamp(16px,4vw,24px);color:#fff0bf;text-shadow:0 1px 2px #54361c;pointer-events:none;animation:potatoWhistleNote 1.1s ease-out 2}
@keyframes potatoPuff{0%{opacity:0;transform:scale(.4)}30%{opacity:.8}100%{opacity:0;transform:translate(18px,-14px) scale(1.6)}}
@keyframes potatoWhistleNote{0%{opacity:0;transform:translate(0,0)}25%{opacity:1}100%{opacity:0;transform:translate(10px,-20px)}}
@media(prefers-reduced-motion:reduce){#app #board.complete .piece[data-prank] .potatoMouth,#app #board.complete .piece[data-prank]::after{animation:none!important}}

(()=>{

  if(prankRunning)return;

  const visited=new Set([first]);let source=first,hop=0;

   const path=outline.cloneNode(false);path.removeAttribute('class');path.removeAttribute('id');path.style.setProperty('fill','#000','important');path.style.setProperty('stroke','none','important');path.style.setProperty('filter','none','important');shadow.appendChild(path);p.prepend(shadow);p.dataset.groundShadow='true';
  });

</script><script>/* Short, local cartoon recordings. Add new clips to the groups to expand the set. */
(()=>{

 const fallback=[...groups.success,...groups.error,'hurry-up'].map(id=>({id,lang:'en',kind:id==='hurry-up'?'urgent':groups.success.includes(id)?'success':'error',src:'../assets/voices/'+id+'.mp3'}));

 const savedAudioMode=localStorage.getItem('10potatoes_audio_mode');
 const savedVoicePreference=localStorage.getItem('10potatoes_voices');
 let ctx=null,loading=null,current=null,enabled=savedVoicePreference!==null?savedVoicePreference!=='off':['all','off','voice','music'].includes(savedAudioMode)?savedAudioMode==='all'||savedAudioMode==='voice':localStorage.getItem('10shapes_music')!=='off';
 function stop(){if(current){const source=current;current=null;try{source.stop();}catch(_){}}}
 function prepare(){
  if(loading)return loading;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return Promise.resolve();
  try{ctx=ctx||new AC();}catch(_){return Promise.resolve();}
  // Load a small selection across languages first, with at most four requests.
  const pending=catalog.slice().sort((a,b)=>{
   const order={success:0,error:1,urgent:2};
   return (order[a.kind]-order[b.kind])||a.phrase?.localeCompare(b.phrase||'')||0;
  });
  async function worker(){
   while(pending.length){
    const clip=pending.shift();
    try{
     const response=await fetch(clip.src+'?v=1');
     if(!response.ok)continue;
     const buffer=await ctx.decodeAudioData(await response.arrayBuffer());
     buffers.set(clip.id,buffer);
    }catch(_){} // An unavailable clip must never delay play.
   }
  }
  loading=Promise.all(Array.from({length:4},worker));
  return loading;
 }
 function unlock(){prepare();if(ctx?.state==='suspended')ctx.resume().catch(()=>{});}
 function setEnabled(value){enabled=!!value;if(!enabled)stop();else unlock();}
 function play(kind,remainingMs=60000){
  if(!enabled||document.hidden||!ctx||ctx.state!=='running')return false;
  const probability=kind==='success'?1/3:kind==='error'?1/2:0;
  if(Math.random()>=probability)return false;
  const available=catalog.filter(clip=>(clip.kind===kind||(kind==='error'&&remainingMs<=15000&&clip.kind==='urgent'))&&buffers.has(clip.id)&&clip.id!==last[kind]);
  if(!available.length)return false;
  // Choose a language first so each language has the same chance.
  const languages=[...new Set(available.map(clip=>clip.lang))];
  const lang=languages[Math.floor(Math.random()*languages.length)];
  const choices=available.filter(clip=>clip.lang===lang);
  const id=choices[Math.floor(Math.random()*choices.length)].id;
  // A new event replaces the old reaction; never queue voices behind gameplay.
  stop();
  const source=ctx.createBufferSource(),gain=ctx.createGain();
  source.buffer=buffers.get(id);gain.gain.value=.2;
  source.connect(gain);gain.connect(ctx.destination);
  source.onended=()=>{source.disconnect();gain.disconnect();if(current===source)current=null;};
  current=source;last[kind]=id;
  window.PotatoSoundtrack?.duck(Math.ceil(source.buffer.duration*1000));
  source.start();return true;
 }

 function playEffect(kind){
  if(!enabled||document.hidden||!ctx||ctx.state!=='running'||!['fart','whistle'].includes(kind))return false;
  stop();const gain=ctx.createGain(),filter=ctx.createBiquadFilter(),when=ctx.currentTime,duration=kind==='fart'?.48:1.15;
  let source;
  if(kind==='fart'){
   const n=Math.ceil(ctx.sampleRate*duration),buffer=ctx.createBuffer(1,n,ctx.sampleRate),samples=buffer.getChannelData(0);
   for(let i=0;i<n;i++){const t=i/ctx.sampleRate,phase=2*Math.PI*(95*t-55*t*t);samples[i]=(Math.sin(phase)+.35*Math.sin(phase*2.7))*.45*(.55+.45*Math.sin(t*110))*Math.pow(1-t/duration,.5)}
   source=ctx.createBufferSource();source.buffer=buffer;filter.type='lowpass';filter.frequency.value=520;gain.gain.setValueAtTime(.13,when);gain.gain.exponentialRampToValueAtTime(.001,when+duration);
  }else{
   source=ctx.createOscillator();source.type='sine';source.frequency.setValueAtTime(1250,when);source.frequency.linearRampToValueAtTime(1630,when+.25);source.frequency.linearRampToValueAtTime(1370,when+.48);source.frequency.linearRampToValueAtTime(1550,when+.8);filter.type='lowpass';filter.frequency.value=2500;gain.gain.setValueAtTime(.001,when);gain.gain.linearRampToValueAtTime(.025,when+.06);gain.gain.setValueAtTime(.025,when+duration-.12);gain.gain.exponentialRampToValueAtTime(.001,when+duration);
  }
  source.connect(filter);filter.connect(gain);gain.connect(ctx.destination);current=source;
  source.onended=()=>{source.disconnect();filter.disconnect();gain.disconnect();if(current===source)current=null};
  window.PotatoSoundtrack?.duck(Math.ceil(duration*1000));source.start(when);source.stop(when+duration);return true;
 }

 document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
 window.PotatoVoices={prepare,unlock,play,playEffect,stop,setEnabled};
})();
