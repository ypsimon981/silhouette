<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10Potatoes — Patate fotografiche</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;font:16px system-ui;color:#4a3322;background-color:#eee7d8;background-image:var(--arena-art);background-size:256px 256px}main{max-width:1000px;margin:auto}h1{font-size:24px}p{line-height:1.5}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}figure{margin:0;text-align:center}svg{display:block;width:100%;aspect-ratio:1;filter:drop-shadow(0 3px 3px #49332140)}figcaption{background:#fff8eac9;border-radius:8px;padding:6px;font-size:13px}@media(max-width:650px){body{padding:16px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}}
</style><main><h1>Le nuove patate</h1><p>Tutte le 91 sagome patata, senza faccine e con i contorni originali del gioco.</p><label>Quadro: <select id="stage"><option value="1">Base: 1–2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option></select></label><div class="grid"></div><p><a href="../?refresh=0.22.54">Apri il gioco</a></p></main><script src="../photo-potatoes.js?v=2"></script><script src="../tablecloths.js?v=2"></script><script>
const labels=['Cerchio','Quadrato','L','Ovale','Cuscino','Stella a 4 punte','Stella a 5 punte','Rettangolo','Semicerchio','Triangolo','Mezzaluna'];
function level(e){const match=e.name.match(/^organic(\d+)-/);return match?Number(match[1]):e.name.endsWith('3')?3:1;}
function render(){const stage=Number(document.querySelector('#stage').value),entries=PhotoPotatoes.entries.filter(e=>level(e)===stage),grid=document.querySelector('.grid');grid.replaceChildren();entries.forEach((e,i)=>{const f=document.createElement('figure'),c=document.createElement('figcaption');c.textContent=stage===1?labels[i]:e.name;f.append(PhotoPotatoes.create({path:e.raw,rotation:0},e.path),c);grid.append(f);});void PhotoPotatoes.preload(entries);}
document.querySelector('#stage').value=new URLSearchParams(location.search).get('stage')||'1';document.querySelector('#stage').onchange=render;render();void Tablecloths.apply(document.body,0,true);
</script></html>
